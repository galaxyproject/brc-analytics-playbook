# BRC Analytics Inventory
#
# Run playbooks locally on the target VM after SSH login.

all:
  vars:
    ansible_user: brc-admin

  children:
    production:
      hosts:
        brc-analytics-prod.tacc.utexas.edu:
          ssl_cert_email: dannon.baker@gmail.com
          brc_environments:
            - name: brc-prod
              domain: brc-analytics.org
              # Existing letsencrypt cert is filed under prod.brc-analytics.org
              cert_domain: prod.brc-analytics.org
              domain_aliases:
                - prod.brc-analytics.org
                - www.brc-analytics.org
              branch: production
              backend_port: 8000
              context: brc
              # Standalone Next app under sites/brc-analytics; production
              # picked up the split in Release v0.29.0.
              frontend_out_dir: sites/brc-analytics/out
              # Keycloak SSO -- 'galaxy' realm / 'brc-analytics' client
              # (provisioned in infrastructure-playbook). Secret lives in vault.
              keycloak_realm: galaxy
              keycloak_client_id: brc-analytics
              keycloak_client_secret: "{{ vault_keycloak_brc_prod_client_secret }}"
              app_db_password: "{{ vault_app_db_password_prod }}"
            - name: ga2-prod
              domain: genomeark2.org
              branch: production
              backend_port: 8001
              context: ga2
              build_script: "build-prod:ga2"
              catalog_build_script: "build-ga2-db"
              # Standalone Next app under sites/ga2; production picked up the
              # split in Release v0.29.0.
              frontend_out_dir: sites/ga2/out
              catalog_source_dir: catalog/ga2/source/
              organism_images: ga2

    development:
      hosts:
        brc-analytics-dev.tacc.utexas.edu:
          ssl_cert_email: dannon.baker@gmail.com
          brc_environments:
            - name: brc-dev
              domain: dev.brc-analytics.org
              # Logan preview. `feat/logan-search` is the integration branch for
              # the whole Logan stack -- kmindex search, per-user Galaxy jobs,
              # the assistant handoff, and the cohort map -- collapsed onto the
              # single branch behind PR #1716. That branch is the one thing to
              # follow now: `logan-deploy` and the three feature branches it
              # was assembled from are retired. It lives on the dannon fork,
              # not galaxyproject, so this entry overrides the repo it pulls
              # from -- the rest of the host still tracks galaxyproject.
              # Revert repo_url + branch (and the build settings below) once the
              # feature merges upstream.
              #
              # Set the branch HERE, never via `-e brc_repo_branch=...`:
              # brc-auto-update.sh.j2 bakes `{{ env.branch }}` in per
              # environment, so an -e override leaves the generated script
              # watching origin/main, and the 3-hourly timer would see a
              # mismatch and revert the deploy. Re-run `make auto-update` after
              # changing it so the script regenerates.
              repo_url: https://github.com/dannon/brc-analytics.git
              branch: feat/logan-search
              backend_port: 8000
              context: brc
              # Standalone Next app under sites/brc-analytics -- feat/logan-search
              # is rebased onto main, so the default build-dev:brc script and
              # the split export path both apply, same as any other brc env.
              frontend_out_dir: sites/brc-analytics/out
              # Keycloak SSO -- 'galaxy-test' realm / 'dev-brc-analytics' client
              # (provisioned in infrastructure-playbook). Secret lives in vault.
              keycloak_realm: galaxy-test
              keycloak_client_id: dev-brc-analytics
              keycloak_client_secret: "{{ vault_keycloak_brc_dev_client_secret }}"
              app_db_password: "{{ vault_app_db_password_dev }}"
              # Show the Galaxy SSO login UI on dev (baked into the frontend build)
              frontend_login_enabled: true
              # Logan/kmindex search. Confirmed to run against Galaxy Test.
              # The key is a SERVICE ACCOUNT credential, and since this branch
              # it is the ANONYMOUS path only: a signed-in visitor's jobs run
              # under their own Galaxy bearer token, in their own account, once
              # they have linked it. Anonymous jobs still share this one
              # account, so the key stays required and stays in vault.
              #
              # PREREQUISITES, both of which fail the play for this host if
              # missing, and because the auto-update timer runs with no
              # env_filter, a brc-dev failure also stops ga2-dev updating:
              #   1. vault_galaxy_api_key_dev must exist (`make vault-edit`)
              #   2. the DuckDB mirror must be a real file at the path below
              galaxy_api_url: https://test.galaxyproject.org/api
              galaxy_api_key: "{{ vault_galaxy_api_key_dev }}"
              # Built externally (sra-poc/sra-slim.duckdb, schema_version 3),
              # bind mounted read-only into the backend. Deliberately outside
              # the release trees so it survives deploys, and every branch this
              # env has pointed at reads it with the same code -- the existing
              # file is fine and does not need rebuilding or re-copying.
              #
              # The map's coordinate layer wants schema_version 6, which this
              # file is not. That degrades on purpose: the coordinates
              # capability closes on its own and the country choropleth keeps
              # serving, so points stay absent until a v6 file is copied here.
              sra_mirror_host_path: /opt/brc-analytics-data/sra-mirror.duckdb
            - name: ga2-dev
              domain: dev.genomeark2.org
              branch: main
              backend_port: 8001
              context: ga2
              build_script: "build-dev:ga2"
              catalog_build_script: "build-ga2-db"
              # Standalone Next app under sites/ga2, so `next build
              # sites/ga2` exports there; catalog source is under catalog/ga2/.
              frontend_out_dir: sites/ga2/out
              catalog_source_dir: catalog/ga2/source/
              organism_images: ga2
