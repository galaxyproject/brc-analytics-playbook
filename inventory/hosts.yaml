# BRC Analytics Inventory
#
# Run playbooks locally on the target VM after SSH login.

all:
  vars:
    ansible_user: brc-admin

  children:
    production:
      hosts:
        brc-analytics-prod.tacc.utexas.edu:
          ssl_cert_email: dannon.baker@gmail.com
          brc_environments:
            - name: brc-prod
              domain: brc-analytics.org
              # Existing letsencrypt cert is filed under prod.brc-analytics.org
              cert_domain: prod.brc-analytics.org
              domain_aliases:
                - prod.brc-analytics.org
                - www.brc-analytics.org
              branch: production
              backend_port: 8000
              context: brc
              # PRODUCTION branch is still pre-split -- the root Next app is
              # intact there and exports to out/. Flip to sites/brc-analytics
              # /out (and brc_build_script in group_vars/all) next release.
              frontend_out_dir: out
              # Keycloak SSO -- 'galaxy' realm / 'brc-analytics' client
              # (provisioned in infrastructure-playbook). Secret lives in vault.
              keycloak_realm: galaxy
              keycloak_client_id: brc-analytics
              keycloak_client_secret: "{{ vault_keycloak_brc_prod_client_secret }}"
              app_db_password: "{{ vault_app_db_password_prod }}"
            - name: ga2-prod
              domain: genomeark2.org   # TODO: confirm -- apex currently aliases CloudFront
              branch: production
              backend_port: 8001
              context: ga2
              build_script: "build-prod:ga2"
              catalog_build_script: "build-ga2-db"
              # PRODUCTION branch is still pre-split: `build-prod:ga2` there is
              # a plain `next build`, so the export lands at the repo root.
              # Flip to sites/ga2/out once main -> production has the split.
              frontend_out_dir: out
              catalog_source_dir: catalog/ga2/source/
              organism_images: ga2
              # Skip cert acquisition; install cert manually then flip off
              ssl_skip: true

    development:
      hosts:
        brc-analytics-dev.tacc.utexas.edu:
          ssl_cert_email: dannon.baker@gmail.com
          brc_environments:
            - name: brc-dev
              domain: dev.brc-analytics.org
              # Logan/kmindex is PARKED until its app branch is pushed to
              # galaxyproject/brc-analytics -- `logan-search` currently only
              # exists on the dannon fork, and brc_repo_url points at
              # galaxyproject, so there is nothing here to fetch. Left on main
              # so this entry stays deployable and, more importantly, so the
              # 3-hourly auto-update timer does not fail on it: the generated
              # brc-auto-update.sh runs playbook-update.yaml with no env_filter,
              # so one broken environment stops ga2-dev updating too.
              #
              # To turn Logan on: push the app branch, set it here (NOT via
              # `-e brc_repo_branch=...` -- brc-auto-update.sh.j2 bakes
              # `{{ env.branch }}` in per environment, so an -e override leaves
              # the generated script watching origin/main and the timer reverts
              # the deploy), re-run `make auto-update`, then un-park the three
              # settings below.
              branch: main
              backend_port: 8000
              context: brc
              # Standalone Next app under sites/brc-analytics; the root Next
              # app was decommissioned upstream, so nothing exports to out/.
              frontend_out_dir: sites/brc-analytics/out
              # Keycloak SSO -- 'galaxy-test' realm / 'dev-brc-analytics' client
              # (provisioned in infrastructure-playbook). Secret lives in vault.
              keycloak_realm: galaxy-test
              keycloak_client_id: dev-brc-analytics
              keycloak_client_secret: "{{ vault_keycloak_brc_dev_client_secret }}"
              app_db_password: "{{ vault_app_db_password_dev }}"
              # Show the Galaxy SSO login UI on dev (baked into the frontend build)
              frontend_login_enabled: true
              # --- Logan/kmindex, PARKED (see the branch note above) ---
              # All three reference things that do not exist yet, and each one
              # fails the play for this host on its own: the vault key is not in
              # group_vars/all/vault.yaml, and sra_mirror_host_path is asserted
              # to be a real file before the build runs. The plumbing they feed
              # (api.env.j2, the read-only bind mount, the enablement gate) is
              # already in place and inert without them -- un-comment all three
              # together once the key is added and the mirror is on the VM.
              #
              # CONFIRM which Galaxy should run these jobs before enabling; the
              # URL below is the backend's own default, not a decision.
              # galaxy_api_url: https://test.galaxyproject.org/api
              # galaxy_api_key: "{{ vault_galaxy_api_key_dev }}"
              # sra_mirror_host_path: /opt/brc-analytics-data/sra-mirror.duckdb
            - name: ga2-dev
              domain: dev.genomeark2.org
              branch: main
              backend_port: 8001
              context: ga2
              build_script: "build-dev:ga2"
              catalog_build_script: "build-ga2-db"
              # Standalone Next app under sites/ga2, so `next build
              # sites/ga2` exports there; catalog source is under catalog/ga2/.
              frontend_out_dir: sites/ga2/out
              catalog_source_dir: catalog/ga2/source/
              organism_images: ga2
