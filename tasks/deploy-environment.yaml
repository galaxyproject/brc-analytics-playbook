# Deploy a single environment.
#
# Run as the brc-admin service user. The host-level prerequisites
# (deploy dir creation, SSL certs, nginx routing config, certbot timer)
# are owned by playbook-bootstrap.yaml and must be in place before this
# runs. There is no privilege escalation here.
#
# deploy_mode (default "full"):
#   full    -- clone, build, stage a release, then publish (atomic swap) + start
#   build   -- clone, build, stage a release WITHOUT swapping it live or touching
#              the running containers (prebuild off the cutover's critical path)
#   publish -- swap to the last staged release and (re)start the backend, no rebuild
#
# env:
#   name: brc-dev
#   domain: dev.brc-analytics.org
#   branch: main
#   backend_port: 8000
---
- name: "Set environment-specific variables for {{ env.name }}"
  ansible.builtin.set_fact:
    env_deploy_dir: "/opt/brc-analytics-{{ env.name }}"
    env_backend_dir: "/opt/brc-analytics-{{ env.name }}/backend"
    env_repo_url: "{{ env.repo_url | default(brc_repo_url) }}"
    brc_domain: "{{ env.domain }}"
    brc_repo_branch: "{{ env.branch }}"
    brc_context: "{{ env.context | default('brc') }}"
    brc_keycloak_realm: "{{ env.keycloak_realm | default('') }}"
    brc_keycloak_client_id: "{{ env.keycloak_client_id | default('') }}"
    brc_keycloak_client_secret: "{{ env.keycloak_client_secret | default('') }}"
    app_db_password: "{{ env.app_db_password | default('') }}"
    brc_galaxy_api_url: "{{ env.galaxy_api_url | default(brc_galaxy_api_url) }}"
    brc_galaxy_api_key: "{{ env.galaxy_api_key | default('') }}"
    brc_sra_mirror_host_path: "{{ env.sra_mirror_host_path | default('') }}"

# Fail fast rather than after the build: Docker happily creates an empty
# DIRECTORY at a bind-mount source that doesn't exist, which the backend then
# rejects (it requires a file) and disables the SRA join -- silently, and
# leaving a bogus directory behind. Only checked when a mirror is configured.
- name: "Stat SRA mirror file ({{ env.name }})"
  ansible.builtin.stat:
    path: "{{ brc_sra_mirror_host_path }}"
  register: sra_mirror_stat
  when: brc_sra_mirror_host_path | length > 0

- name: "Assert SRA mirror file exists ({{ env.name }})"
  ansible.builtin.assert:
    that: sra_mirror_stat.stat.isreg | default(false)
    fail_msg: >-
      sra_mirror_host_path is set to {{ brc_sra_mirror_host_path }} for
      {{ env.name }} but that is not a regular file on this host. Put the
      DuckDB mirror there, or drop sra_mirror_host_path from the inventory
      entry to deploy without the SRA join.
  when: brc_sra_mirror_host_path | length > 0

# --- Build phase (skipped in publish mode, which ships an already-built release) ---

# bootstrap seeds a fresh env with releases/_placeholder and a 'current'
# symlink so nginx has a valid root before anything is deployed. That leaves
# the deploy dir non-empty, and ansible.builtin.git shells out to `git clone`
# when there is no .git -- which refuses a non-empty destination. Without this,
# the first deploy of every bootstrapped env fails. Only ever removes the
# placeholder: a real checkout has .git, and an _adopt seed implies one too.
- name: "Clear bootstrap placeholder before initial clone ({{ env.name }})"
  ansible.builtin.shell: |
    set -euo pipefail
    d={{ env_deploy_dir | quote }}
    [ -d "$d" ] || exit 0
    cd "$d"
    if [ ! -e .git ] && [ "$(readlink current 2>/dev/null || true)" = "releases/_placeholder" ]; then
      rm -rf releases/_placeholder current
      rmdir releases 2>/dev/null || true
    fi
  changed_when: false
  when: deploy_mode | default('full') != 'publish'

- name: "Clone or update repository ({{ env.name }})"
  ansible.builtin.git:
    repo: "{{ env_repo_url }}"
    dest: "{{ env_deploy_dir }}"
    version: "{{ env.branch }}"
    force: true
  register: git_clone
  when: deploy_mode | default('full') != 'publish'

# npm/catalog steps can be skipped for backend_only deployments because
# the catalog output files are committed to the repo and pulled with git
- name: "Install npm dependencies ({{ env.name }})"
  ansible.builtin.command:
    cmd: npm ci
    chdir: "{{ env_deploy_dir }}"
  register: npm_install
  changed_when: "'added' in npm_install.stdout"
  when:
    - not (backend_only | default(false))
    - deploy_mode | default('full') != 'publish'

- name: "Build catalog data ({{ env.name }})"
  ansible.builtin.command:
    cmd: npm run {{ env.catalog_build_script | default('build-brc-db') }}
    chdir: "{{ env_deploy_dir }}"
  changed_when: true
  when:
    - not (backend_only | default(false))
    - deploy_mode | default('full') != 'publish'

- name: "Build Next.js static export ({{ env.name }})"
  ansible.builtin.command:
    cmd: npm run {{ env.build_script | default(brc_build_script) }}
    chdir: "{{ env_deploy_dir }}"
  environment:
    NODE_OPTIONS: "--max-old-space-size={{ nextjs_build_max_old_space_mb }}"
    NEXT_PUBLIC_LOGIN_ENABLED: "{{ env.frontend_login_enabled | default(false) | string | lower }}"
  changed_when: true
  when:
    - not (backend_only | default(false))
    - deploy_mode | default('full') != 'publish'

# Kept on the deploy path, unlike update, so a first stand-up of an environment
# comes up complete instead of rendering every organism image broken until
# someone remembers `make fetch-images`. Independent of the build (nginx serves
# these from a persistent dir), so it runs in publish mode too -- a publish-only
# cutover on a fresh host still needs the images. Re-running deploy is cheap:
# the sync skips objects already present at the same size.
- name: "Sync organism images ({{ env.name }})"
  ansible.builtin.include_tasks: tasks/organism-images.yaml
  when: not (backend_only | default(false))

# Stage the freshly-built export dir as an immutable release. Its location
# is per environment (frontend_out_dir): the root app exports to out/, a
# standalone site app like ga2 to sites/ga2/out. A same-filesystem mv is
# instant and preserves the SELinux label it inherited down from the (chcon'd)
# env dir, so no privileged relabel is needed. .staged-release records what
# the publish step should flip to (also read back by deploy_mode=publish).
- name: "Stage frontend release ({{ env.name }})"
  ansible.builtin.shell: |
    set -euo pipefail
    out_dir={{ (env.frontend_out_dir | default('out')) | quote }}
    sha="$(git rev-parse --short HEAD)"
    rel="releases/${sha}-$(date +%Y%m%d%H%M%S)"
    mkdir -p releases
    rm -rf "$rel"
    mv "$out_dir" "$rel"
    echo "$rel" > .staged-release
  args:
    chdir: "{{ env_deploy_dir }}"
  register: staged_release
  changed_when: true
  when:
    - not (backend_only | default(false))
    - deploy_mode | default('full') != 'publish'

# --- Config + image (run in every mode; cheap and idempotent) ---

- name: "Template backend environment file ({{ env.name }})"
  ansible.builtin.template:
    src: templates/api.env.j2
    dest: "{{ env_backend_dir }}/api/.env"
    mode: "0600"

- name: "Template docker-compose override ({{ env.name }})"
  ansible.builtin.template:
    src: templates/docker-compose.backend-only.yml.j2
    dest: "{{ env_backend_dir }}/docker-compose.override.yml"
    mode: "0644"

- name: "Build backend image ({{ env.name }})"
  ansible.builtin.command:
    cmd: docker compose -p brc-analytics-{{ env.name }} build backend
    chdir: "{{ env_backend_dir }}"
  environment:
    APP_VERSION: "{{ lookup('file', env_deploy_dir + '/package.json') | from_json | json_query('version') }}"

# --- Publish phase (skipped in build mode, which leaves the live release and the
#     running containers untouched so a release can be staged off the cutover path) ---

- name: "Stop any running containers ({{ env.name }})"
  ansible.builtin.command:
    cmd: docker compose -p brc-analytics-{{ env.name }} down
    chdir: "{{ env_backend_dir }}"
  failed_when: false
  changed_when: false
  when: deploy_mode | default('full') != 'build'

- name: "Start Docker services ({{ env.name }})"
  ansible.builtin.command:
    cmd: docker compose -p brc-analytics-{{ env.name }} up -d
    chdir: "{{ env_backend_dir }}"
  register: docker_up
  when: deploy_mode | default('full') != 'build'

- name: "Wait for backend to be healthy ({{ env.name }})"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ env.backend_port }}/api/v1/health"
    status_code: 200
  register: health_result
  until: health_result.status == 200
  retries: 30
  delay: 5
  when: deploy_mode | default('full') != 'build'

# Flip the served 'current' symlink to the staged release in one atomic step
# (after the backend is healthy), then prune to releases_keep -- the live target
# is always kept.
- name: "Publish frontend release -- atomic swap ({{ env.name }})"
  ansible.builtin.shell: |
    set -euo pipefail
    rel="$(cat .staged-release)"
    test -d "$rel"
    ln -sfn "$rel" current
    cur="$(readlink current)"
    # grep exits 1 when it filters out every line -- exactly the first deploy,
    # where the only release IS current. Under pipefail that failed the publish
    # after the swap had already happened.
    stale="$(ls -1dt releases/*/ 2>/dev/null | sed 's:/*$::' \
      | grep -vx "$cur" \
      | tail -n +{{ releases_keep | int }} || true)"
    if [ -n "$stale" ]; then printf '%s\n' "$stale" | xargs -r rm -rf; fi
  args:
    chdir: "{{ env_deploy_dir }}"
  changed_when: true
  when:
    - not (backend_only | default(false))
    - deploy_mode | default('full') != 'build'

# Record the deployed commit so update's change-detection diffs from here.
# Resolved from the checkout (not git_clone) so it is correct in publish mode too.
- name: "Resolve deployed commit ({{ env.name }})"
  ansible.builtin.command:
    cmd: git rev-parse HEAD
    chdir: "{{ env_deploy_dir }}"
  register: deployed_commit
  changed_when: false
  when: deploy_mode | default('full') != 'build'

- name: "Record successful deploy commit ({{ env.name }})"
  ansible.builtin.copy:
    content: "{{ deployed_commit.stdout }}\n"
    dest: "{{ env_deploy_dir }}/.last-update-commit"
    mode: "0644"
  when: deploy_mode | default('full') != 'build'
